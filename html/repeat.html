<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>1에서 5까지 더하기</title>
	<style>
		body {
			font-size:1.5em;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
		}
	</style>
</head>
<body>
	<script>
		let sum = 0;
		let i = 1;
		do {
			sum += i;
			i++;
		} while (i <= 5);
		console.log(sum);
	</script>
</body>
</html>
